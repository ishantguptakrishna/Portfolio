<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Ishant Kumar Gupta — Portfolio{% endblock %}</title>
<meta name="description" content="Ishant Kumar Gupta — B.Tech CSE student, Python & Machine Learning developer. Portfolio, certifications, internships and hackathon participation.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="titlebar">
  <div class="titlebar-inner">
    <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="brand">ishant<span class="path">@portfolio</span></div>
    <nav class="tabs" id="tabs">
      <a class="tab {{ 'active' if active=='home' else '' }}" href="{{ url_for('home') }}"><span class="dot"></span>index.html</a>
      <a class="tab {{ 'active' if active=='certifications' else '' }}" href="{{ url_for('certifications') }}"><span class="dot"></span>certifications.py</a>
      <a class="tab {{ 'active' if active=='internships' else '' }}" href="{{ url_for('internships') }}"><span class="dot"></span>internships.py</a>
      <a class="tab {{ 'active' if active=='competitions' else '' }}" href="{{ url_for('competitions') }}"><span class="dot"></span>competitions.py</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰ menu</button>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="eyebrow">end_of_file</div>
        <div style="font-family:var(--mono); color:var(--text-muted); font-size:0.85rem;">Built with Flask &amp; a lot of coffee ☕ — © 2026 Ishant Kumar Gupta</div>
      </div>
      <div class="social-row">
        <a class="social-btn" href="mailto:gupta.ishant2004@gmail.com">✉ email</a>
        <a class="social-btn" href="https://github.com/ishantguptakrishna" target="_blank" rel="noopener">⌥ github</a>
        <a class="social-btn" href="tel:+918092427524">☎ +91-8092427524</a>
      </div>
    </div>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
